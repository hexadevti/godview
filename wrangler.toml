name = "godview"
compatibility_date = "2026-07-06"

# Static SPA served via Cloudflare Workers Static Assets. The Git build runs
# `npm run build` (→ ./dist), then `npx wrangler deploy` uploads ./dist. There
# is no Worker script (no `main`) — it's assets-only. Unmatched routes fall back
# to index.html so client-side routing works (SPA behavior).
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
